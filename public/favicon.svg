<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Background with Untitled UI Indigo Tone -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Envelope Main Body -->
  <g filter="url(#shadow)">
    <!-- Back / Base Envelope -->
    <rect x="12" y="18" width="40" height="28" rx="6" fill="#ffffff" fill-opacity="0.96" />

    <!-- Envelope Fold Lines (Clean Minimalist Vector) -->
    <path d="M12 21L32 35L52 21" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M12 43L26 31" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M52 43L38 31" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Fast Bolt Badge (Temp / Instant Mail Concept) -->
  <circle cx="45" cy="45" r="10" fill="#0f172a" />
  <circle cx="45" cy="45" r="8.5" fill="#1e1b4b" />
  <path d="M46 39L41 45.5H45L44 51L49 44.5H45L46 39Z" fill="#38bdf8" stroke="#38bdf8" stroke-width="0.5" stroke-linejoin="round" />
</svg>
